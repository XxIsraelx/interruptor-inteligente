; Firmware do Interruptor Inteligente — ESP32 + PZEM-004T v3 + relé
; Abra esta pasta no VS Code com a extensão PlatformIO e clique em Upload.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  mandulaj/PZEM-004T-v30 @ ^1.1.2
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.2.0
